# SAMPLE CONFIGURATION FILE
# Copy this file to application.properties and fill in real values or set environment variables.
# The real application.properties is gitignored to avoid leaking secrets.

# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tourismdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

# JWT Configuration
jwt.secret=${JWT_SECRET:change_me}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.jharkhand.tourism=${APP_LOG_LEVEL:DEBUG}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:DEBUG}

# AI/ML API Configuration (Placeholders for future integration)
ai.gemini.api.key=${GEMINI_API_KEY:}
ai.gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}

# Google Maps API Configuration (Placeholder)
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

# Blockchain Configuration (Placeholder)
blockchain.network.url=${BLOCKCHAIN_NETWORK_URL:https://sepolia.infura.io/v3/}
blockchain.contract.address=${BLOCKCHAIN_CONTRACT_ADDRESS:}

# Sentiment Analysis API Configuration (Placeholder)
sentiment.api.key=${SENTIMENT_API_KEY:}
sentiment.api.url=${SENTIMENT_API_URL:https://api.api-ninjas.com/v1/sentiment?text=}
